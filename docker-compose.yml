version: '3.8'

services:
  # Backend service (Django)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: cardgames-backend
    restart: always
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - ./backend/.env
    depends_on:
      - db
      - redis
    networks:
      - cardgames-network
    ports:
      - "8000:8000"

  # Frontend service (Angular)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cardgames-frontend
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "4200:80"
    networks:
      - cardgames-network
    depends_on:
      - backend

  # Database service (PostgreSQL)
  db:
    image: postgres:14
    container_name: cardgames-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - ./db.env
    networks:
      - cardgames-network
    ports:
      - "5432:5432"

  # Redis service (for Channels/WebSockets)
  redis:
    image: redis:7-alpine
    container_name: cardgames-redis
    restart: always
    networks:
      - cardgames-network
    ports:
      - "6379:6379"

  # Nginx service for static files and routing
  nginx:
    image: nginx:1.23-alpine
    container_name: cardgames-nginx
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/home/app/staticfiles
      - media_volume:/home/app/media
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    networks:
      - cardgames-network

volumes:
  postgres_data:
  static_volume:
  media_volume:

networks:
  cardgames-network:
    driver: bridge
