<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <rect width="300" height="200" fill="#f5f5f5" rx="8" ry="8"/>
  
  <!-- Card pile background -->
  <rect x="50" y="40" width="200" height="120" rx="5" ry="5" fill="#2c8338"/>
  
  <!-- Cards -->
  <rect x="70" y="50" width="60" height="90" rx="5" ry="5" fill="white" stroke="#999" stroke-width="1"/>
  <rect x="90" y="60" width="60" height="90" rx="5" ry="5" fill="white" stroke="#999" stroke-width="1"/>
  <rect x="110" y="70" width="60" height="90" rx="5" ry="5" fill="white" stroke="#999" stroke-width="1"/>
  <rect x="130" y="80" width="60" height="90" rx="5" ry="5" fill="white" stroke="#999" stroke-width="1"/>
  <rect x="150" y="90" width="60" height="90" rx="5" ry="5" fill="white" stroke="#999" stroke-width="1"/>
  
  <!-- Card symbols -->
  <text x="80" y="70" font-family="Arial" font-size="12" fill="#e5173f">A♥</text>
  <text x="160" y="110" font-family="Arial" font-size="12" fill="#212121">K♠</text>
  
  <text x="150" y="180" font-family="Arial" font-size="18" text-anchor="middle" fill="#333">Solitaire</text>
</svg>
